name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore DentalClinic.sln

      - name: Build
        run: dotnet build DentalClinic.sln --configuration Release --no-restore

      # Tests marked [Explicit] (Supabase migrations and schema checks) are skipped automatically.
      - name: Test
        run: dotnet test DentalClinic.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/tests/**/TestResults/

  web:
    name: ${{ matrix.app }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin_website, clinic_website]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder values so the build can run; real values live in Vercel.
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
