worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ─────────────────────────────────────────────────────────────────
    # Upstream (Địa chỉ nội bộ của từng service trong Docker network)
    # Tên host khớp với tên service khai báo trong docker-compose.yml
    # ─────────────────────────────────────────────────────────────────
    upstream api_upstream {
        server api:8080;
    }

    upstream clinic_upstream {
        server clinic_website:3000;
    }

    upstream admin_upstream {
        server admin_website:3000;
    }

    # ─────────────────────────────────────────────────────────────────
    # Server Block chính — Lắng nghe trên cổng 80
    # ─────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Bảo mật: Ẩn thông tin phiên bản Nginx ────────────────────
        server_tokens off;

        # ── Giới hạn kích thước body của request ─────────────────────
        client_max_body_size 20M;

        # ─────────────────────────────────────────────────────────────
        # /api → Backend .NET 9 API
        # KHÔNG strip prefix /api — mọi controller đều khai báo route dạng
        # [Route("api/xxx")] nên .NET app cần nhận nguyên path /api/... .
        # proxy_pass không có URI riêng (không có "/" sau upstream) → nginx
        # chuyển tiếp request URI gốc không đổi.
        # ─────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;

            # Headers quan trọng để API nhận đúng IP gốc của client
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout cho các request xử lý lâu (ví dụ: AI chat, file upload)
            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
            proxy_send_timeout    60s;
        }

        # ─────────────────────────────────────────────────────────────
        # /uploads → File tĩnh do API lưu (icon dịch vụ, ảnh đại diện...)
        # API phục vụ static files ở gốc ứng dụng (UseStaticFiles(), không có
        # tiền tố /api) nên route riêng, KHÔNG gộp vào location /api/ ở trên.
        # ─────────────────────────────────────────────────────────────
        location /uploads/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────────────────────
        # Website Vận hành Nội bộ (Next.js Admin Portal) — KHÔNG dùng basePath,
        # nên route thẳng từng nhóm path khớp đúng cấu trúc thư mục
        # src/app/{admin,staff,dentist,owner,auth}/... của admin_website.
        # /admin cũng đồng thời phục vụ luôn /admin/_next/static/... (assetPrefix).
        # ─────────────────────────────────────────────────────────────
        location ~ ^/(admin|staff|dentist|owner|auth)(/|$) {
            proxy_pass         http://admin_upstream;
            proxy_http_version 1.1;

            # Cần thiết cho Next.js Hot Module Replacement (dev)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────────────────────
        # / → Website Giới thiệu Phòng khám (Next.js Clinic Website)
        # Đặt cuối cùng vì đây là catch-all location
        # ─────────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://clinic_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────────────────────
        # Xử lý lỗi HTTP tùy chỉnh
        # ─────────────────────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
