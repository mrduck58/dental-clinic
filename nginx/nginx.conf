worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ─────────────────────────────────────────────────────────────────
    # Upstreams (Tên service trong Docker network)
    # ─────────────────────────────────────────────────────────────────
    upstream api_upstream {
        server api:8080;
    }

    upstream clinic_upstream {
        server clinic_website:3000;
    }

    upstream admin_upstream {
        server admin_website:3000;
    }

    # ─────────────────────────────────────────────────────────────────
    # Main Local Server Block — Port 80
    # ─────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        server_tokens off;
        client_max_body_size 20M;

        # /api → Backend .NET 9 API
        location /api/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
            proxy_send_timeout    60s;
        }

        # /uploads → Static file upload folder
        location /uploads/ {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin & Staff routes → admin_website
        location ~ ^/(admin|staff|dentist|owner|auth)(/|$) {
            proxy_pass         http://admin_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Catch-all → clinic_website
        location / {
            proxy_pass         http://clinic_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
